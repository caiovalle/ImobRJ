name: Atualizar dados do Data.Rio

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar e converter dados
        run: python scripts/atualizar_dados.py

      - name: Commit e push (só se houve mudança)
        run: |
          if [ -n "$(git status --porcelain public/)" ]; then
            git config user.name  "imobrj-bot"
            git config user.email "actions@users.noreply.github.com"
            git add public/dados.json public/meta.json
            git commit -m "dados: atualização automática do Data.Rio ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "Sem mudanças nos dados."
          fi
